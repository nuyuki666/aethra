<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Aethra</title>
<meta name="description" content="Вход в личный кабинет Aethra.">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css?v=18">
<link rel="stylesheet" href="assets/css/app.css?v=18">

<script defer src="assets/js/icons.js?v=18"></script>
<script defer src="assets/js/liquid.js?v=18"></script>
<script defer src="assets/js/app.js?v=18"></script>
<script defer src="assets/js/store.js?v=18"></script>
<script defer src="assets/js/auth.js?v=18"></script>
</head>
<body data-auth-page="login">

<a class="skip-link" href="#main">Перейти к содержимому</a>

<div class="backdrop" aria-hidden="true">
  <canvas class="backdrop__canvas"></canvas>
  <div class="backdrop__fallback"></div>
</div>

<header class="nav">
  <nav class="nav__inner" aria-label="Основная навигация">
    <a class="brand" href="/main">
      <svg class="i brand__mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 2.5 21h19z"/><path d="M8.4 15h7.2"/>
      </svg>
      Aethra
    </a>

    <ul class="nav__links">
      <span class="nav__pill" aria-hidden="true"></span>
      <li><a class="nav__link" href="/main"><svg class="i"><use href="#i-home"></use></svg>Главная</a></li>
      <li><a class="nav__link" href="/main#pricing"><svg class="i"><use href="#i-card"></use></svg>Тарифы</a></li>
      <li><a class="nav__link" href="terms.html"><svg class="i"><use href="#i-doc"></use></svg>Условия</a></li>
    </ul>

    <div class="nav__actions">
      <a class="btn btn--primary btn--sm" href="register.html">Регистрация</a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="navSheet" aria-label="Меню">
        <svg class="i i--lg"><use href="#i-menu"></use></svg>
      </button>
    </div>
  </nav>

  <div class="nav__sheet" id="navSheet" hidden>
    <a class="nav__sheet-link" href="/main"><svg class="i"><use href="#i-home"></use></svg>Главная</a>
    <a class="nav__sheet-link" href="/main#pricing"><svg class="i"><use href="#i-card"></use></svg>Тарифы</a>
    <a class="nav__sheet-link" href="terms.html"><svg class="i"><use href="#i-doc"></use></svg>Условия</a>
    <div class="nav__sheet-actions" style="grid-template-columns:1fr">
      <a class="btn btn--primary btn--sm" href="register.html">Регистрация</a>
    </div>
  </div>
</header>

<main class="page auth" id="main">
  <div class="auth__card">
    <div class="auth__head" data-reveal>
      <h1>С возвращением</h1>
      <p>Войдите, чтобы открыть подписку, ключи и загрузку лоадера.</p>
    </div>

    <div class="card" data-reveal>
      <form class="auth__form" data-validate data-auth="login">
        <div class="field">
          <label class="field__label" for="loginName">Логин или e-mail</label>
          <input class="input" id="loginName" name="login" type="text" autocomplete="username" placeholder="awdawd" data-rule="required">
          <p class="field__error" role="alert"></p>
        </div>

        <div class="field">
          <label class="field__label" for="loginPw">Пароль</label>
          <div style="position:relative">
            <input class="input" id="loginPw" name="password" type="password" autocomplete="current-password" placeholder="••••••••" data-rule="required" style="padding-right:44px">
            <button class="btn btn--quiet btn--sm" type="button" data-toggle-pw="loginPw" aria-label="Показать пароль" aria-pressed="false"
                    style="position:absolute;right:4px;top:50%;translate:0 -50%;min-height:36px;padding-inline:var(--sp-2)">
              <svg class="i"><use href="#i-eye"></use></svg>
            </button>
          </div>
          <p class="field__error" role="alert"></p>
        </div>

        <label class="checkbox">
          <input type="checkbox" name="remember" checked>
          <span>Запомнить меня на этом устройстве</span>
        </label>

        <button class="btn btn--primary btn--block" type="submit">Войти</button>

        <div class="auth__sep">или</div>

        <a class="btn btn--ghost btn--block" href="https://t.me/aethra_helper" target="_blank" rel="noopener">
          <svg class="i"><use href="#i-message"></use></svg> Написать в поддержку
        </a>
      </form>

      <p class="auth__foot">Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a></p>
    </div>

    <p class="auth__foot" style="margin-top:var(--sp-5);font-size:var(--fs-xs)">
      Продолжая, вы принимаете <a href="terms.html">условия использования</a>.
    </p>
  </div>
</main>

</body>
</html>
