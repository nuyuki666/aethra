<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Личный кабинет — Solis</title>
<meta name="description" content="Управление аккаунтом: информация, привязка HWID, смена пароля и лицензии.">
<meta name="theme-color" content="#08090b">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=42">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css?v=52">
<link rel="stylesheet" href="assets/css/app.css?v=52">

<style>
  :root {
    --bg-dark: #080a0f;
    --accent-blue: #38bdf8;
    --accent-blue-deep: #2563eb;
    --accent-blue-hover: #1d4ed8;
    --accent-amber: #d97706;
    --accent-amber-hover: #b45309;
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
    --text-green: #4ade80;
    --input-bg: rgba(13, 17, 23, 0.78);
    --input-border: rgba(255, 255, 255, 0.09);
    --input-focus: #38bdf8;
    --card-bg: rgba(11, 15, 25, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
  }

  body {
    background: radial-gradient(circle at 50% 25%, rgba(13, 18, 28, 0.78) 0%, rgba(6, 8, 13, 0.96) 80%),
                url('/minecraft.png') center/cover no-repeat fixed;
    color: var(--text-primary);
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Минималистичный верхний бар */
  .profile-header-nav {
    width: 100%;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    z-index: 10;
  }
  .profile-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffffff;
    text-decoration: none;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .profile-brand-icon {
    width: 20px;
    height: 20px;
    color: var(--accent-blue);
  }
  .profile-nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .profile-nav-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .profile-nav-link:hover {
    color: #ffffff;
  }

  /* Основной контейнер профиля (по центру) */
  .profile-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 60px;
    box-sizing: border-box;
  }

  .profile-box {
    width: 100%;
    max-width: 650px;
    box-sizing: border-box;
    animation: fadeIn 0.35s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Бейдж сверху «Управление аккаунтом» */
  .profile-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #60a5fa;
    font-size: 0.84rem;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .profile-tag svg {
    color: #60a5fa;
  }

  /* Заголовок «Добро пожаловать, <никнейм>» */
  .profile-title {
    font-size: 2.2rem;
    font-weight: 800;
    color: #ffffff;
    margin: 0 0 32px 0;
    letter-spacing: -0.025em;
    line-height: 1.2;
  }
  .profile-username {
    color: var(--accent-blue);
    background: linear-gradient(135deg, #38bdf8 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Секции */
  .profile-section {
    margin-bottom: 30px;
  }
  .profile-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .profile-bullet {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8, 0 0 14px rgba(56, 189, 248, 0.4);
    display: inline-block;
  }
  .profile-section-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: #ffffff;
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* Сетка «Информация» (3 колонки х 2 строки) */
  .info-matrix {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px 20px;
  }
  .info-cell {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .info-cell-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .info-cell-label svg {
    color: #60a5fa;
  }
  .info-cell-val {
    font-size: 1.02rem;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.01em;
    word-break: break-all;
  }
  .val-green {
    color: #4ade80 !important;
  }

  /* Форма смены пароля */
  .password-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pass-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pass-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    color: #60a5fa;
  }
  .pass-label svg {
    color: #60a5fa;
  }
  .pass-input-box {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }
  .pass-input {
    width: 100%;
    height: 44px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 9px;
    padding: 0 42px 0 14px;
    color: #ffffff;
    font-size: 0.92rem;
    font-family: inherit;
    outline: none;
    transition: all 0.18s ease;
    box-sizing: border-box;
  }
  .pass-input:focus {
    background: rgba(15, 23, 42, 0.95);
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
  }
  .pass-input::placeholder {
    color: #475569;
    font-size: 0.88rem;
  }
  .pass-eye-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #64748b;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }
  .pass-eye-btn:hover {
    color: #cbd5e1;
  }
  .pass-row-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .pass-submit-btn {
    width: 100%;
    height: 44px;
    background: var(--accent-blue-deep);
    color: #ffffff;
    border: none;
    border-radius: 9px;
    font-size: 0.94rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.18s ease;
    margin-top: 2px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }
  .pass-submit-btn:hover {
    background: var(--accent-blue-hover);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    transform: translateY(-1px);
  }
  .pass-submit-btn:active {
    transform: translateY(0);
  }

  /* Нижний бар с кнопками */
  .profile-actions-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  .p-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 9999px;
    font-size: 0.86rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.18s ease;
    border: 1px solid transparent;
    box-sizing: border-box;
    font-family: inherit;
  }
  .p-btn--blue {
    background: var(--accent-blue-deep);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }
  .p-btn--blue:hover {
    background: var(--accent-blue-hover);
    transform: translateY(-1px);
  }
  .p-btn--amber {
    background: var(--accent-amber);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
  }
  .p-btn--amber:hover {
    background: var(--accent-amber-hover);
    transform: translateY(-1px);
  }
  .p-btn--dark {
    background: rgba(13, 17, 26, 0.72);
    border-color: rgba(255, 255, 255, 0.09);
    color: #cbd5e1;
    backdrop-filter: blur(6px);
  }
  .p-btn--dark:hover {
    background: rgba(25, 33, 48, 0.85);
    border-color: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    transform: translateY(-1px);
  }

  /* Модальное окно активации ключа */
  .key-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 10, 0.75);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
    animation: fadeIn 0.2s ease-out;
  }
  .key-modal-card {
    background: #0d111a;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    width: 100%;
    max-width: 420px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    position: relative;
  }
  .key-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .key-modal-head h3 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 700;
    color: #ffffff;
  }
  .key-modal-close {
    background: none;
    border: none;
    color: #64748b;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px;
    transition: color 0.15s;
  }
  .key-modal-close:hover {
    color: #ffffff;
  }
  .key-modal-desc {
    color: var(--text-secondary);
    font-size: 0.88rem;
    margin: 0 0 18px 0;
  }

  @media (max-width: 640px) {
    .profile-title {
      font-size: 1.7rem;
      margin-bottom: 24px;
    }
    .info-matrix {
      grid-template-columns: 1fr 1fr;
    }
    .pass-row-2col {
      grid-template-columns: 1fr;
    }
    .profile-actions-bar {
      flex-direction: column;
      align-items: stretch;
    }
    .p-btn {
      justify-content: center;
    }
  }
</style>

<script defer src="assets/js/icons.js?v=52"></script>
<script defer src="assets/js/liquid.js?v=52"></script>

<body data-auth-page="profile">

<header class="profile-header-nav">
  <a class="profile-brand" href="/main">
    <svg class="profile-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5 2.5 21h19z"/><path d="M8.4 15h7.2"/>
    </svg>
    <span>Solis</span>
  </a>

  <nav class="profile-nav-links">
    <a class="profile-nav-link" href="/main">Главная</a>
    <a class="profile-nav-link" href="terms.html">Условия</a>
    <button class="p-btn p-btn--dark" style="padding: 6px 14px; font-size: 0.8rem;" type="button" data-nav-logout>
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Выйти</span>
    </button>
  </nav>
</header>

<main class="profile-wrapper" id="main">
  <div class="profile-box">

    <!-- Тег сверху -->
    <div class="profile-tag">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Управление аккаунтом</span>
    </div>

    <!-- Заголовок -->
    <h1 class="profile-title">
      Добро пожаловать, <span class="profile-username" data-user-name>Player</span>
    </h1>

    <!-- Секция: Информация -->
    <section class="profile-section">
      <div class="profile-section-header">
        <span class="profile-bullet"></span>
        <h2 class="profile-section-name">Информация</h2>
      </div>

      <div class="info-matrix">
        <!-- Никнейм -->
        <div class="info-cell">
          <div class="info-cell-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Никнейм</span>
          </div>
          <div class="info-cell-val" data-kv="login">—</div>
        </div>

        <!-- Роль -->
        <div class="info-cell">
          <div class="info-cell-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>Роль</span>
          </div>
          <div class="info-cell-val" data-kv="role">Default</div>
        </div>

        <!-- UID -->
        <div class="info-cell">
          <div class="info-cell-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <circle cx="9" cy="10" r="2"></circle>
              <line x1="15" y1="8" x2="17" y2="8"></line>
              <line x1="15" y1="12" x2="17" y2="12"></line>
            </svg>
            <span>UID</span>
          </div>
          <div class="info-cell-val" data-kv="id">1</div>
        </div>

        <!-- Почта -->
        <div class="info-cell">
          <div class="info-cell-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <span>Почта</span>
          </div>
          <div class="info-cell-val" data-kv="email">—</div>
        </div>

        <!-- HWID -->
        <div class="info-cell">
          <div class="info-cell-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span>HWID</span>
          </div>
          <div class="info-cell-val val-green" data-kv="hwid">Привязан.</div>
        </div>

        <!-- Дата регистрации -->
        <div class="info-cell">
          <div class="info-cell-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Дата регистрации</span>
          </div>
          <div class="info-cell-val" data-kv="reg">—</div>
        </div>
      </div>
    </section>

    <!-- Секция: Смена пароля -->
    <section class="profile-section">
      <div class="profile-section-header">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h2 class="profile-section-name">Смена пароля</h2>
      </div>

      <form data-validate data-auth="password" class="password-form">
        <!-- Текущий пароль -->
        <div class="pass-field field">
          <label class="pass-label" for="pwCurrent">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Текущий пароль</span>
          </label>
          <div class="pass-input-box">
            <input class="pass-input input" id="pwCurrent" type="password" placeholder="Введите пароль..." data-rule="required" autocomplete="current-password">
            <button type="button" class="pass-eye-btn" onclick="togglePass('pwCurrent', this)" aria-label="Показать пароль">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p class="field__error" role="alert"></p>
        </div>

        <!-- Новый пароль и повтор -->
        <div class="pass-row-2col">
          <div class="pass-field field">
            <label class="pass-label" for="pwNew">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Новый пароль</span>
            </label>
            <div class="pass-input-box">
              <input class="pass-input input" id="pwNew" type="password" placeholder="Введите пароль..." data-rule="password" autocomplete="new-password">
              <button type="button" class="pass-eye-btn" onclick="togglePass('pwNew', this)" aria-label="Показать пароль">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p class="field__error" role="alert"></p>
          </div>

          <div class="pass-field field">
            <label class="pass-label" for="pwRepeat">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Повторите новый пароль</span>
            </label>
            <div class="pass-input-box">
              <input class="pass-input input" id="pwRepeat" type="password" placeholder="Введите пароль..." data-rule="password" data-match="pwNew" autocomplete="new-password">
              <button type="button" class="pass-eye-btn" onclick="togglePass('pwRepeat', this)" aria-label="Показать пароль">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p class="field__error" role="alert"></p>
          </div>
        </div>

        <!-- Кнопка «Сменить пароль» -->
        <button class="pass-submit-btn btn" type="submit">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Сменить пароль</span>
        </button>
      </form>
    </section>

    <!-- Нижняя панель действий -->
    <div class="profile-actions-bar">
      <!-- 1. Активировать ключ -->
      <button type="button" class="p-btn p-btn--blue" id="btnOpenKeyModal">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="12" r="4"></circle>
          <path d="M12 12h9l-1.8 2.2M17 12v3.2"></path>
        </svg>
        <span>Активировать ключ</span>
      </button>

      <!-- 2. Доп. Панель -->
      <a href="admin.html" class="p-btn p-btn--amber" id="adminPanelBtn" style="display:none;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span>Доп. Панель</span>
      </a>

      <!-- 3. Скачать лаунчер -->
      <a href="#" class="p-btn p-btn--dark" data-download-loader>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"></path>
          <path d="m7.5 11 4.5 4 4.5-4"></path>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
        </svg>
        <span>Скачать лаунчер</span>
      </a>

      <!-- 4. Выйти из аккаунта -->
      <button type="button" class="p-btn p-btn--dark" data-nav-logout>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Выйти из аккаунта</span>
      </button>
    </div>

  </div>
</main>

<!-- Модальное окно активации ключа -->
<div class="key-modal-backdrop" id="keyModal" style="display:none;">
  <div class="key-modal-card">
    <div class="key-modal-head">
      <h3>Активация ключа</h3>
      <button type="button" class="key-modal-close" onclick="closeKeyModal()">✕</button>
    </div>
    <p class="key-modal-desc">Введите полученный лицензионный ключ формата SOLIS-XXXX-XXXX</p>
    <form data-validate data-auth="key" class="password-form">
      <div class="pass-field field">
        <input class="pass-input input" id="keyInput" name="key" type="text" placeholder="SOLIS-0000-0000" autocomplete="off" data-rule="required">
        <p class="field__error" role="alert"></p>
      </div>
      <button class="pass-submit-btn btn" type="submit">Активировать</button>
    </form>
  </div>
</div>

<script>
  function togglePass(id, btn) {
    var inp = document.getElementById(id);
    if (!inp) return;
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.style.color = '#38bdf8';
    } else {
      inp.type = 'password';
      btn.style.color = '#64748b';
    }
  }

  function openKeyModal() {
    var m = document.getElementById('keyModal');
    if (m) m.style.display = 'flex';
  }

  function closeKeyModal() {
    var m = document.getElementById('keyModal');
    if (m) m.style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var keyBtn = document.getElementById('btnOpenKeyModal');
    if (keyBtn) keyBtn.addEventListener('click', openKeyModal);

    var modal = document.getElementById('keyModal');
    if (modal) {
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeKeyModal();
      });
    }

    // Проверяем роль пользователя для показа «Доп. Панель»
    setTimeout(async function () {
      try {
        if (window.SolisStore) {
          var me = await window.SolisStore.current();
          if (me && me.role === 'admin') {
            var adminBtn = document.getElementById('adminPanelBtn');
            if (adminBtn) adminBtn.style.display = 'inline-flex';
          }
        }
      } catch (err) {}
    }, 200);
  });
</script>

</body>
</html>
